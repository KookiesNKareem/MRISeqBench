[project]
name = "mriseqbench"
version = "0.1.0"
description = "Composable MRI sequence tasks and independent submission evaluation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "pypulseq==1.5.0.post1",
    "numpy>=2,<3",
    "h5py>=3.12,<4",
]

[project.scripts]
mriseqbench = "mriseqbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
