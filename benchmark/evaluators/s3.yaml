# yaml-language-server: $schema=../../schemas/evaluators.schema.json
schema_version: 1
id: s3
version: 6
scope: benchmark
calibrated: false
reconstruction: bart_sampling_sense@1
spatial_samples: 2097152
spatial_replicates: 4
spatial_max_samples: 2097152
spatial_seed: 1729
spatial_mode: fixed
phantom_slab_mm: 5.0
image_score_estimator: mean_image
metrics:
- name: ideal_complex_image_nrmse
  max: 0.15
- name: ideal_signal_fraction
  min: 0.5
- name: ideal_outside_object_energy_fraction
  max: 0.25
case_image_criteria:
  static:
    complex_nrmse_max: 0.15
    magnitude_nrmse_max: 0.15
    phase_rms_rad_max: 0.35
    tissue_signal_fraction_min: 0.5
    contrast_retention_min: 0.5
    outside_energy_fraction_max: 0.25
# Per-task limits (docs/S3_EVALUATION.md): max(1.5x worst reference, 1.2x worst
# valid design at >=500 Hz/pixel) across hardware, never looser than static.
