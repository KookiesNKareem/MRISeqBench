schema_version: 1
id: fields_and_motion
version: 1
description: Combined scanner-fixed fields and rigid object motion.
level: P4
effects:
- kind: b0
  model: linear
  offset_hz: 0
  gradient_hz_per_m:
  - 1000
  - 0
- kind: b1
  model: linear
  center_scale: 1
