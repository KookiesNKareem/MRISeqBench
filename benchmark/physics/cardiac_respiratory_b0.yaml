  mid-diastolic end-expiratory gating window.
reference_field_strength_T: 3
effects:
- kind: b0
  model: linear
  offset_hz: 0
  gradient_hz_per_m:
  - 1000
  - 0
- kind: motion
  model: cardiac_respiratory
  rr_interval_s: 1.0
  systolic_duration_s: 0.48
  diastolic_window_s:
  - 0.50
  - 0.84
  cardiac_translation_mm:
  - 4.5
  - -3.5
  cardiac_rotation_deg: 8.0
  atrial_kick_scale: 0.35
  respiratory_period_s: 4.0
  respiratory_quiescent_s: 0.88
  respiratory_translation_mm:
  - 2.5
  - 6.0
