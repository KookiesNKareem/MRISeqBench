# yaml-language-server: $schema=../../schemas/tasks.schema.json
schema_version: 1
id: mrf_schedule
version: 1
objective: Create a variable sequence schedule for MR fingerprinting. Draft authoring
  contract; task-specific evaluation is deferred.
sequence:
  level: S5
  capabilities:
  - spoiled_gre
  - cartesian
  - mrf
  - mapping
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 6
  application:
    flip_angle_schedule_deg:
    - 5
    - 15
    - 30
    - 10
    tr_schedule_ms:
    - 12
    - 15
    - 18
    - 14
object: tissue_discs@1
hardware: standard@1
evaluation: image_fidelity@1
submission:
  format: pulseq
  file: sequence.seq
