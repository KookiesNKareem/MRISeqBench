# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: mrf_schedule
objective: Create a variable sequence schedule for MR fingerprinting.
sequence:
  level: S5
  capabilities: [spoiled_gre, cartesian, mrf, mapping]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  application:
    flip_angle_schedule_deg: [5, 15, 30, 10]
    tr_schedule_ms: [12, 15, 18, 14]
