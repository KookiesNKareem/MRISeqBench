id: partial_fourier
objective: Create a Cartesian spoiled GRE acquisition using partial Fourier sampling.
sequence:
  level: S3
  capabilities: [spoiled_gre, cartesian, partial_fourier]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  sampling:
    partial_fourier_fraction: 0.75
