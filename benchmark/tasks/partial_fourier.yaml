# yaml-language-server: $schema=../../schemas/tasks.schema.json
schema_version: 1
id: partial_fourier
version: 1
objective: Create a Cartesian spoiled GRE acquisition using partial Fourier sampling.
sequence:
  level: S3
  capabilities:
  - spoiled_gre
  - cartesian
  - partial_fourier
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 6
  sampling:
    partial_fourier_fraction: 0.75
object: tissue_discs@1
hardware: standard@1
evaluation: image_fidelity@1
submission:
  format: pulseq
  file: sequence.seq
