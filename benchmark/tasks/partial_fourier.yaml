# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T3.3
id: partial_fourier
version: 2
objective: Create Cartesian spoiled GRE using partial Fourier sampling. Retain the contiguous upper
  96 zero-based ky indices, 32 through 127 (ky = -32/FOV to +63/FOV), including the center.
object: P1@1
sequence:
  level: T3
  capabilities: [spoiled_gre, cartesian, partial_fourier]
  matrix: [128, 128]
  fov_mm: [200, 200]
  duration_s: 6
  sampling:
    partial_fourier_fraction: 0.75
evaluation: s3@5
followups:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm and set the excitation flip angle
    to 10 degrees. Preserve the matrix and all other requirements.
  patch:
    fov_mm:
    - 220
    - 220
    flip_angle_deg: 10
- id: parameter
  request: Set the excitation flip angle to 30 degrees. Retain the larger FOV and
    all other requirements.
  patch:
    flip_angle_deg: 30
- id: sampling
  request: Increase the asymmetric ky partial-Fourier coverage fraction to 0.8125
    (104 of 128 lines), while retaining the 220 x 220 mm FOV and 30-degree flip angle.
  patch:
    sampling.partial_fourier_fraction: 0.8125
