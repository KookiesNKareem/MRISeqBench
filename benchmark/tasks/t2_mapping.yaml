# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: t2_mapping
objective: Acquire three refocused spin-echo images at TE 20, 40 and 60 ms after each excitation,
  retaining the same phase-encode index across echoes. Use TR 1000 ms for T2 mapping.
sequence:
  level: S5
  capabilities: [spin_echo, cartesian, multi_echo, mapping]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 40
  tr_ms: {target: 1000, tolerance: 50.0}
  application:
    echo_times_ms: [20, 40, 60]
