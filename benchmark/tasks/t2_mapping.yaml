# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T4.2
id: t2_mapping
version: 2
objective: Acquire ECG-triggered bSSFP images after 0, 25 and 50 ms T2 preparation, in that order,
  for T2 mapping. Use four 32-line segments per image, repeat preparation for each segment, and allow three RR intervals
  between preparations. Nonzero preparations use 90-180-180-90 pulses with phases 0-90-90-180 degrees.
object: P1@1
evaluation: s4@4
sequence:
  level: T4
  capabilities: [bssfp, cartesian, t2_preparation, multi_contrast, mapping, triggering, gating]
  matrix: [128, 128]
  fov_mm: [200, 200]
  duration_s: 60
  application:
    preparation_durations_ms: [0, 25, 50]
  temporal:
    frames: 3
    trigger_source: ecg
    rr_interval_ms: 1000
    trigger_delay_ms: 600
    acquisition_window_ms: 200
    segments_per_frame: 4
followups:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm. Preserve the matrix and all
    other requirements.
  patch:
    fov_mm:
    - 220
    - 220
- id: parameter
  request: Set the preparation durations to 0, 30, 60 ms, in that order. Retain the
    larger FOV and all other requirements.
  patch:
    application.preparation_durations_ms:
    - 0
    - 30
    - 60
- id: segmentation
  request: Acquire each T2-prepared frame across 8 ECG-triggered segments (16 lines
    per heartbeat) within a 100 ms acquisition window and a 120 s duration budget,
    retaining the 220 x 220 mm FOV and [0, 30, 60] ms preparation durations.
  patch:
    temporal.segments_per_frame: 8
    temporal.acquisition_window_ms: 100
    duration_s: 120
