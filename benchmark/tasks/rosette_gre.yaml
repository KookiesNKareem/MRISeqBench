# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: rosette_gre
objective: Acquire a 32 x 32 image using four rotated rosette interleaves, each with eight
  lobes and repeated k-space-center crossings.
sequence:
  level: S2
  capabilities: [spoiled_gre, rosette]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  readout:
    interleaves: 4
    rosette_lobes: 8
