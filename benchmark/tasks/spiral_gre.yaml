# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: spiral_gre
objective: Acquire a 32 x 32 image with four uniformly rotated center-out Archimedean spiral
  interleaves, eight turns per interleaf, and TE 5 ms.
sequence:
  level: S2
  capabilities: [spoiled_gre, spiral]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  te_ms: {target: 5, tolerance: 0.5}
  readout:
    interleaves: 4
    turns: 8
    center_out: true
