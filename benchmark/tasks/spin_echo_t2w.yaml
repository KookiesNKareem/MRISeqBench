# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T1.3
id: spin_echo_t2w
version: 2
objective: Create a Cartesian spin-echo acquisition with one 90-degree excitation and one 180-degree
  refocusing pulse per k-space line. Use TE 80 ms and TR 1000 ms for T2 weighting.
object: P1@1
sequence:
  level: T1
  capabilities: [spin_echo, cartesian]
  matrix: [128, 128]
  fov_mm: [200, 200]
  duration_s: 135
  te_ms: {target: 80, tolerance: 8.0}
  tr_ms: {target: 1000, tolerance: 50.0}
evaluation: s1@6
followups:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm. Preserve the matrix and all
    other requirements.
  patch:
    fov_mm:
    - 220
    - 220
- id: parameter
  request: Set TE to 100 ms (tolerance 5 ms). Retain the larger FOV and all other
    requirements.
  patch:
    te_ms:
      target: 100
      tolerance: 5
- id: slice_selection
  request: Add 2D slice selection with a 5 mm slice thickness (FWHM tolerance 20%)
    and through-plane rephasing, while retaining the larger FOV and preceding TE change.
  patch:
    slice_thickness_mm: 5
