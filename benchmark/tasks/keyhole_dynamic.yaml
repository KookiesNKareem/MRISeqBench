# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: keyhole_dynamic
objective: Acquire four Cartesian frames. Fully acquire the first frame; reacquire the central
  quarter of phase-encode lines in each later frame and reuse peripheral lines from the first
  frame.
sequence:
  level: S4
  capabilities: [spoiled_gre, cartesian, keyhole, view_sharing, dynamic]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  temporal:
    frames: 4
    frame_duration_ms: 250
    ordering: sequential
    view_sharing_window: 4
    center_fraction: 0.25
