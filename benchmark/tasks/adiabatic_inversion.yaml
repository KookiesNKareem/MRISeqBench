# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: adiabatic_inversion
objective: Apply a 10 ms hyperbolic-secant adiabatic inversion pulse followed by Cartesian
  spoiled GRE, with inversion time 600 ms measured to the center-k-space echo.
sequence:
  level: S5
  capabilities: [spoiled_gre, cartesian, adiabatic, inversion]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  application:
    preparation_duration_ms: 10
    inversion_time_ms: 600
