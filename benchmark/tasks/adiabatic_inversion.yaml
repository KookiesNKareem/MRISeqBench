# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T4.4
id: adiabatic_inversion
version: 2
objective: Acquire an ECG-triggered inversion-prepared bSSFP image using a 10 ms adiabatic
  hyperbolic-secant inversion pulse, robust to ±20% B1 error, and TI 600 ms. Acquire four 32-line segments in the declared cardiac window, repeating the
  preparation before each segment.
object: P1@1
evaluation: s4@4
sequence:
  level: T4
  capabilities: [bssfp, cartesian, adiabatic, inversion, triggering, gating]
  matrix: [128, 128]
  fov_mm: [200, 200]
  duration_s: 20
  application:
    preparation_duration_ms: 10
    inversion_time_ms: 600
  temporal:
    frames: 1
    trigger_source: ecg
    rr_interval_ms: 1000
    trigger_delay_ms: 600
    acquisition_window_ms: 200
    segments_per_frame: 4
followups:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm. Preserve the matrix and all
    other requirements.
  patch:
    fov_mm:
    - 220
    - 220
- id: parameter
  request: Set the inversion time to 650 ms and move the acquisition window start
    to 650 ms. Retain the larger FOV and all other requirements.
  patch:
    application.inversion_time_ms: 650
    temporal.trigger_delay_ms: 650
- id: segmentation
  request: Acquire the inversion-prepared frame across 8 ECG-triggered segments (16
    lines per heartbeat) within a 100 ms acquisition window and a 40 s duration budget,
    retaining the 220 x 220 mm FOV and 650 ms TI.
  patch:
    temporal.segments_per_frame: 8
    temporal.acquisition_window_ms: 100
    duration_s: 40
