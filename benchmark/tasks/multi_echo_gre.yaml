# yaml-language-server: $schema=../../schemas/tasks.schema.json
schema_version: 1
id: multi_echo_gre
version: 1
objective: Acquire three gradient echoes after each excitation at TE 4, 12 and 20
  ms, preserving the same phase-encode index across echoes. Use TR 32 ms.
sequence:
  level: S5
  capabilities:
  - spoiled_gre
  - cartesian
  - multi_echo
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 6
  tr_ms:
    target: 32
    tolerance: 1.6
  application:
    echo_times_ms:
    - 4
    - 12
    - 20
object: tissue_discs@1
hardware: standard@1
evaluation: image_fidelity@1
submission:
  format: pulseq
  file: sequence.seq
