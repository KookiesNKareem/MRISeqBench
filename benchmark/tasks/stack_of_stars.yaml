# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: stack_of_stars
objective: Acquire a 3D stack-of-stars volume with 32 Cartesian partitions and 48 uniformly
  spaced radial spokes per partition.
sequence:
  level: S2
  capabilities: [spoiled_gre, stack_of_stars, radial]
  matrix: [32, 32, 32]
  fov_mm: [200, 200, 200]
  duration_s: 30
  tr_ms: {target: 12, tolerance: 0.6000000000000001}
  readout:
    spokes: 48
object: volume_ellipsoids@1
