# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: epi_single_shot
objective: Acquire a complete 32 x 32 Cartesian image in one excitation using an alternating-polarity
  EPI readout.
sequence:
  level: S2
  capabilities: [epi, cartesian]
  matrix: [32, 32]
  fov_mm: [200, 200]
  te_ms: {target: 30, tolerance: 3}
  duration_s: 1
