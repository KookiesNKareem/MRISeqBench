# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T2.1
id: epi_single_shot
version: 2
objective: Acquire a 128 x 128 single-shot EPI image with nominal acceleration three.
  Retain zero-based ky indices 1, 4, ..., 127 (43 lines total). Use exactly one acquiring
  excitation; preparation RF such as spoiled fat saturation is allowed only before it.
  Use alternating readout polarity and monotonic ky order. Standard SENSE reconstruction uses the fixed,
  known receive maps; no calibration lines are required.
object: P1@1
sequence:
  level: T2
  capabilities: [epi, cartesian, undersampling, sense]
  matrix: [128, 128]
  fov_mm: [200, 200]
  te_ms: {max: 120}
  duration_s: 1
  sampling:
    acceleration: 3
    calibration_lines: 0
    pattern: uniform
evaluation: s2@6
followups:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm and set TE to 80 ms (tolerance
    2 ms). Preserve the matrix and all other requirements.
  patch:
    fov_mm:
    - 220
    - 220
    te_ms:
      target: 80
      tolerance: 2
- id: parameter
  request: Set TE to 90 ms (tolerance 2 ms). Retain the larger FOV and all other requirements.
  patch:
    te_ms:
      target: 90
      tolerance: 2
- id: sampling
  request: Accelerate the single-shot EPI readout to R=2 along ky with 8 central calibration
    lines, while retaining the 220 x 220 mm FOV and 90 ms TE.
  patch:
    sampling.acceleration: 2
    sampling.calibration_lines: 8
