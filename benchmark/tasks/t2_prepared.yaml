# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: t2_prepared
objective: Create an ECG-triggered cardiac T2-prepared Cartesian bSSFP acquisition.
  Use a 40 ms T2 preparation with a 90-degree tip-down, two 180-degree refocusing
  pulses and a 90-degree tip-up, ending before imaging. Every acquired ADC sample
  must lie between 600 and 800 ms after its ECG R-wave trigger, using nominal RR 1000
  ms on physio1; preparations may precede that window. Use ordinary Cartesian reconstruction.
  Complete magnetization preparation before the imaging window. Balance net gradient
  area on all three axes in every readout TR; alternate excitation RF phase by 180
  degrees between readout TRs and keep receiver phases coherent with that RF phase
  cycle.
object: cardiac_2d@1
evaluation: s4@1
sequence:
  level: S4
  capabilities:
  - bssfp
  - cartesian
  - t2_preparation
  - triggering
  - gating
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 6
  application:
    preparation_duration_ms: 40
  temporal:
    frames: 1
    frame_duration_ms: 1000
    ordering: sequential
    trigger_source: ecg
    rr_interval_ms: 1000
    trigger_delay_ms: 600
    acquisition_window_ms: 200
