# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: t2_prepared
objective: Apply a 40 ms T2 preparation using a 90-degree tip-down, two 180-degree refocusing
  pulses and a 90-degree tip-up, followed by Cartesian spoiled GRE.
sequence:
  level: S5
  capabilities: [spoiled_gre, cartesian, t2_preparation]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  application:
    preparation_duration_ms: 40
