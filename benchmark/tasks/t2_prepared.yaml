# yaml-language-server: $schema=../../schemas/tasks.schema.json
schema_version: 1
id: t2_prepared
version: 1
objective: Apply a 40 ms T2 preparation using a 90-degree tip-down, two 180-degree
  refocusing pulses and a 90-degree tip-up, followed by Cartesian spoiled GRE.
sequence:
  level: S5
  capabilities:
  - spoiled_gre
  - cartesian
  - t2_preparation
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 6
  application:
    preparation_duration_ms: 40
object: tissue_discs@1
hardware: standard@1
evaluation: image_fidelity@1
submission:
  format: pulseq
  file: sequence.seq
