# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T4.3
id: t2_prepared
version: 2
objective: Acquire an ECG-triggered bSSFP image after a 40 ms T2 preparation (90-180-180-90, phases
  0-90-90-180 degrees). Use four 32-line segments in the declared cardiac window, repeating the preparation
  for each segment.
object: P1@1
evaluation: s4@4
sequence:
  level: T4
  capabilities: [bssfp, cartesian, t2_preparation, triggering, gating]
  matrix: [128, 128]
  fov_mm: [200, 200]
  duration_s: 20
  application:
    preparation_duration_ms: 40
  temporal:
    frames: 1
    trigger_source: ecg
    rr_interval_ms: 1000
    trigger_delay_ms: 600
    acquisition_window_ms: 200
    segments_per_frame: 4
followups:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm. Preserve the matrix and all
    other requirements.
  patch:
    fov_mm:
    - 220
    - 220
- id: parameter
  request: Set the preparation duration to 50 ms. Retain the larger FOV and all other
    requirements.
  patch:
    application.preparation_duration_ms: 50
- id: segmentation
  request: Acquire the T2-prepared frame across 8 ECG-triggered segments (16 lines
    per heartbeat) within a 100 ms acquisition window and a 40 s duration budget,
    retaining the 220 x 220 mm FOV and 50 ms preparation duration.
  patch:
    temporal.segments_per_frame: 8
    temporal.acquisition_window_ms: 100
    duration_s: 40
