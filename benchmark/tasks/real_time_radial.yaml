# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: real_time_radial
objective: Acquire eight consecutive radial frames, with 16 uniformly spaced spokes per frame
  and 100 ms frame duration. Do not share views between frames.
sequence:
  level: S4
  capabilities: [spoiled_gre, radial, real_time]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  readout:
    spokes: 16
  temporal:
    frames: 8
    frame_duration_ms: 100
    ordering: sequential
