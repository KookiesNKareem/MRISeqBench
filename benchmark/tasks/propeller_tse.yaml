# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: propeller_tse
objective: Acquire 16 equally rotated Cartesian PROPELLER blades, each containing eight adjacent
  k-space lines acquired with a refocused echo train.
sequence:
  level: S2
  capabilities: [spin_echo, tse, propeller]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 20
  te_ms: {target: 40, tolerance: 4.0}
  tr_ms: {target: 1000, tolerance: 50.0}
  readout:
    shots: 16
    echo_train_length: 8
    blade_width_lines: 8
    echo_spacing_ms: 10
