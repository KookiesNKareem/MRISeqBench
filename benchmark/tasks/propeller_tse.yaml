# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T2.7
id: propeller_tse
version: 2
objective: Acquire 64 Cartesian PROPELLER blades uniformly rotated over 180 degrees, each containing eight adjacent
  k-space lines acquired with a refocused echo train.
object: P1@1
sequence:
  level: T2
  capabilities: [spin_echo, tse, propeller]
  matrix: [128, 128]
  fov_mm: [200, 200]
  duration_s: 72
  te_ms: {target: 40, tolerance: 4.0}
  tr_ms: {target: 1000, tolerance: 50.0}
  readout:
    shots: 64
    echo_train_length: 8
    blade_width_lines: 8
    echo_spacing_ms: 10
evaluation: s2@6
followups:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm. Preserve the matrix and all
    other requirements.
  patch:
    fov_mm:
    - 220
    - 220
- id: parameter
  request: Set TE to 50 ms (tolerance 2 ms). Retain the larger FOV and all other requirements.
  patch:
    te_ms:
      target: 50
      tolerance: 2
- id: readout
  request: Increase the PROPELLER readout to 48 rotated blades (still 16 lines per
    blade), while retaining the 220 x 220 mm FOV and preceding TE change.
  patch:
    readout.shots: 48
