# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: bssfp
objective: Create Cartesian balanced SSFP with alternating 0/180-degree RF phase and zero
  net gradient area on every axis each TR. Use a 35-degree flip angle, TE 2.5 ms and TR 5
  ms.
sequence:
  level: S1
  capabilities: [bssfp, cartesian]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  te_ms: {target: 2.5, tolerance: 0.25}
  tr_ms: {target: 5, tolerance: 0.25}
  flip_angle_deg: 35
