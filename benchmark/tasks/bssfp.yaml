# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T1.4
id: bssfp
version: 2
objective: Acquire Cartesian bSSFP with 35-degree excitation, alternating 0/180-degree RF phase,
  and balanced gradient moments every TR, including after the final excitation. Use TE 2.5 ms and TR 5 ms.
object: P1@1
sequence:
  level: T1
  capabilities: [bssfp, cartesian]
  matrix: [128, 128]
  fov_mm: [200, 200]
  duration_s: 6
  te_ms: {target: 2.5, tolerance: 0.25}
  tr_ms: {target: 5, tolerance: 0.25}
  flip_angle_deg: 35
evaluation: s1@6
followups:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm. Preserve the matrix and all
    other requirements.
  patch:
    fov_mm:
    - 220
    - 220
- id: parameter
  request: Set the excitation flip angle to 45 degrees. Retain the larger FOV and
    all other requirements.
  patch:
    flip_angle_deg: 45
- id: slice_selection
  request: Add 2D slice selection with a 5 mm slice thickness (FWHM tolerance 20%)
    and balanced through-plane gradients, while retaining the larger FOV and preceding
    flip-angle change.
  patch:
    slice_thickness_mm: 5
