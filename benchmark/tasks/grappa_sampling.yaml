# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T3.2
id: grappa_sampling
version: 2
objective: 'Acquire an auto-calibrating (GRAPPA-style) Cartesian spoiled GRE mask: every third phase-encode
  line plus 24 contiguous central autocalibration lines. Grid indices are zero based: retain ky indices
  divisible by 3 and add central indices 52 through 75 (59 lines). Grading estimates the coil sensitivities
  from your acquired central calibration lines (ESPIRiT) and reconstructs with them; no known coil maps are used.'
object: P1@1
sequence:
  level: T3
  capabilities: [spoiled_gre, cartesian, undersampling, grappa]
  matrix: [128, 128]
  fov_mm: [200, 200]
  duration_s: 6
  sampling:
    acceleration: 3
    calibration_lines: 24
    pattern: uniform
evaluation: s3@5
followups:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm and set the excitation flip angle
    to 10 degrees. Preserve the matrix and all other requirements.
  patch:
    fov_mm:
    - 220
    - 220
    flip_angle_deg: 10
- id: parameter
  request: Set the excitation flip angle to 30 degrees. Retain the larger FOV and
    all other requirements.
  patch:
    flip_angle_deg: 30
- id: sampling
  request: Set the uniform ky undersampling factor to R=2 with 16 central autocalibration
    lines, while retaining the 220 x 220 mm FOV and 30-degree flip angle.
  patch:
    sampling.acceleration: 2
    sampling.calibration_lines: 16
