# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T2.9
id: ute_radial
version: 2
objective: Acquire 404 center-out radial spokes uniformly spaced over 360 degrees, one per excitation,
  using a nonselective short excitation with no gradient during RF. Achieve TE
  0.9 ms while respecting RF and ADC dead times.
object: P1@1
sequence:
  level: T2
  capabilities: [spoiled_gre, ute, radial]
  matrix: [128, 128]
  fov_mm: [200, 200]
  duration_s: 6
  te_ms: {target: 0.9, tolerance: 0.02}
  readout:
    spokes: 404
    center_out: true
evaluation: s2@6
followups:
- id: flip
  request: Set the excitation flip angle to 10 degrees and TE to 0.95 ms (tolerance
    0.005 ms). Preserve all other requirements.
  patch:
    flip_angle_deg: 10
    te_ms:
      target: 0.95
      tolerance: 0.005
- id: parameter
  request: Set TE to 0.98 ms (tolerance 0.005 ms). Retain the 10-degree excitation
    and all other requirements.
  patch:
    te_ms:
      target: 0.98
      tolerance: 0.005
- id: readout
  request: Increase the centre-out UTE radial readout to 460 spokes uniformly spanning
    [0, 2*pi), while retaining the 10-degree flip angle and 0.98 ms TE.
  patch:
    readout.spokes: 460
