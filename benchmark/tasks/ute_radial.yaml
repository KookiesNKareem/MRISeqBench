# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: ute_radial
objective: Acquire 48 center-out radial spokes using a nonselective short excitation. Achieve
  TE 0.5 ms while respecting RF and ADC dead times.
sequence:
  level: S2
  capabilities: [spoiled_gre, ute, radial]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  te_ms: {target: 0.5, tolerance: 0.05}
  readout:
    spokes: 48
    center_out: true
