# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: rfov_epi
objective: >-
  Acquire a single-shot reduced-FOV gradient-echo EPI image using a genuine 2D
  spatially selective RF excitation. Select a central 160 mm extent in x and
  100 mm extent in y within the prescribed 200 x 200 mm FOV. The cardiac anatomy
  fits within the x extent; the reduced phase FOV is the central half in y.
  Preserve 6.25 mm spatial resolution: acquire 32 x 16 samples, retaining even
  zero-based ky indices of the prescribed 32 x 32 full-FOV grid, with 32 samples
  per x readout and alternating readout polarity. Use one excitation/readout
  shot; do not use a refocusing pulse or reconstruct an undersampled full-FOV
  image as a substitute for spatial selection. RF must overlap encoding
  gradients in both x and y. Suppress signal outside the selected rectangle,
  including x outside 80 mm and y outside 50 mm, and produce coherent signal
  within it. Diagnostic water spins (PD=1, T1=0.8 s, T2=0.08 s, z=0) must retain
  at least 0.20 of equilibrium PD at every tested interior point, checked at
  the first, central and last EPI line centres. The largest exterior magnitude divided by
  mean interior magnitude must be no more than 0.10. Interior probes cover
  x=-56,0,56 mm and nine y positions spanning -35 to 35 mm. Stopband probes
  cover y=-96 to -65 mm and 65 to 96 mm at those x positions, plus x=-96,-92,92,96 mm
  at y=-25,0,25 mm. The judge verifies the excitation response in both dimensions,
  reduced-FOV sampling, EPI polarity, and the reconstructed cardiac image under
  declared B0 and intrinsic fat chemical shift. Use the fixed cropped BART FFT
  reconstruction. TE at the central-ky echo is an upper limit; choose pulse duration and timing within
  the supplied hardware and SAR limits. Image encoding is measured from the end
  of the final RF-containing block, including its selection-gradient rewinding.
  The phase oracle retains the RF selection gradients and declared fields, and
  excludes subsequent imaging gradients and your submitted ADC phase.
object: cardiac_2d@1
evaluation: s3@3
sequence:
  level: S3
  capabilities: [rf_excitation_2d, epi, cartesian, reduced_fov]
  matrix: [32, 32]
  fov_mm: [200, 200]
  te_ms: {max: 80}
  duration_s: 0.25
  readout: {shots: 1, echo_train_length: 16}
  sampling:
    reduced_fov_fraction: 0.5
    pattern: reduced_fov
