  pair with iy 60..67 and iz 12..19, including odd iz.
sequence:
  level: T3
  capabilities: [spoiled_gre, cartesian, undersampling, caipirinha]
  matrix: [128, 128, 32]
  fov_mm: [200, 200, 200]
  duration_s: 64
  sampling:
    acceleration: 4
    calibration_lines: 8
    caipi_shift: 1
    pattern: uniform
object: P1@1
evaluation: s3@4
