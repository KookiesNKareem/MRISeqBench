# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T2.5
id: radial_readout
version: 2
objective: Create a spoiled GRE acquisition of 202 full-diameter radial spokes through k=0, uniformly
  spaced over 180 degrees, with one spoke per excitation.
object: P1@1
sequence:
  level: T2
  capabilities: [spoiled_gre, radial]
  matrix: [128, 128]
  fov_mm: [200, 200]
  duration_s: 6
  readout:
    spokes: 202
evaluation: s2@6
followups:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm and set the excitation flip angle
    to 10 degrees. Preserve the matrix and all other requirements.
  patch:
    fov_mm:
    - 220
    - 220
    flip_angle_deg: 10
- id: parameter
  request: Set the excitation flip angle to 30 degrees. Retain the larger FOV and
    all other requirements.
  patch:
    flip_angle_deg: 30
- id: readout
  request: Increase the radial readout to 256 spokes uniformly spanning [0, pi) with
    a 6.5 s duration budget, while retaining the 220 x 220 mm FOV and preceding flip-angle
    change.
  patch:
    readout.spokes: 256
    duration_s: 6.5
