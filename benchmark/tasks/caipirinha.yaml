# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T3.7
id: caipirinha
version: 2
objective: Acquire 128 x 128 x 32 CAIPIRINHA at Ry=Rz=2. Retain even zero-based kz indices iz; in retained
  partition j=iz/2 retain zero-based ky indices iy congruent to j modulo 2. Also include every calibration
  pair with iy 60..67 and iz 12..19, including odd iz.
sequence:
  level: T3
  capabilities: [spoiled_gre, cartesian, undersampling, caipirinha]
  matrix: [128, 128, 32]
  fov_mm: [200, 200, 200]
  duration_s: 64
  sampling:
    acceleration: 4
    calibration_lines: 8
    caipi_shift: 1
    pattern: uniform
object: P1@1
evaluation: s3@5
followups:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm and set the excitation flip angle
    to 10 degrees. Preserve the matrix and all other requirements.
  patch:
    fov_mm:
    - 220
    - 220
    - 200
    flip_angle_deg: 10
- id: parameter
  request: Set the excitation flip angle to 30 degrees. Retain the larger FOV and
    all other requirements.
  patch:
    flip_angle_deg: 30
- id: sampling
  request: Expand the central calibration region to 12 x 12 (ky, kz) lines, while
    retaining the 220 x 220 x 200 mm FOV, 30-degree flip angle, and 2x2 CAIPIRINHA
    shift-1 lattice.
  patch:
    sampling.calibration_lines: 12
