# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: radial_cine
objective: Create a cine bSSFP acquisition with golden-angle radial frame ordering.
sequence:
  level: S4
  capabilities: [bssfp, radial, golden_angle, cine]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  temporal:
    frames: 4
    frame_duration_ms: 250
    ordering: golden_angle
