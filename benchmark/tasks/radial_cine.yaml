# yaml-language-server: $schema=../../schemas/tasks.schema.json
schema_version: 1
id: radial_cine
version: 1
objective: Create a cine bSSFP acquisition with golden-angle radial frame ordering.
  Draft authoring contract; task-specific evaluation is deferred.
sequence:
  level: S4
  capabilities:
  - bssfp
  - radial
  - golden_angle
  - cine
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 6
  temporal:
    frames: 4
    frame_duration_ms: 250
    ordering: golden_angle
object: tissue_discs@1
hardware: standard@1
evaluation: image_fidelity@1
submission:
  format: pulseq
  file: sequence.seq
