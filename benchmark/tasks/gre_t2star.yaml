# yaml-language-server: $schema=../../schemas/tasks.schema.json
schema_version: 1
id: gre_t2star
version: 1
objective: Create Cartesian spoiled GRE with a 20-degree flip angle, TE 20 ms and
  TR 30 ms for T2-star weighting.
sequence:
  level: S1
  capabilities:
  - spoiled_gre
  - cartesian
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 6
  te_ms:
    target: 20
    tolerance: 2.0
  tr_ms:
    target: 30
    tolerance: 1.5
  flip_angle_deg: 20
object: tissue_discs@1
hardware: standard@1
evaluation: image_fidelity@1
submission:
  format: pulseq
  file: sequence.seq
