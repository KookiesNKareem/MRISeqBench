# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T2.4
id: grase
version: 2
objective: Acquire a Cartesian GRASE image in 16 shots. Each shot has four spin echoes and two gradient echoes per
  spin echo, with readout polarity alternating across all eight echoes of the shot.
object: P1@1
sequence:
  level: T2
  capabilities: [spin_echo, grase, epi]
  matrix: [128, 128]
  fov_mm: [200, 200]
  duration_s: 20
  te_ms: {target: 40, tolerance: 4.0}
  tr_ms: {target: 1000, tolerance: 50.0}
  readout:
    shots: 16
    echo_train_length: 8
evaluation: s2@6
followups:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm. Preserve the matrix and all
    other requirements.
  patch:
    fov_mm:
    - 220
    - 220
- id: parameter
  request: Set TE to 50 ms (tolerance 2 ms). Retain the larger FOV and all other requirements.
  patch:
    te_ms:
      target: 50
      tolerance: 2
- id: readout
  request: Reconfigure the GRASE readout to 32 shots with echo train length 4 and
    a 36 s duration budget, while retaining the 220 x 220 mm FOV and 50 ms TE.
  patch:
    readout.shots: 32
    readout.echo_train_length: 4
    duration_s: 36
