# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: grase
objective: Acquire a Cartesian GRASE image in four shots. Each shot has four spin echoes with
  two alternating-polarity gradient echoes around each spin echo, producing eight lines per
  shot.
sequence:
  level: S2
  capabilities: [spin_echo, grase, epi]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 8
  te_ms: {target: 40, tolerance: 4.0}
  tr_ms: {target: 1000, tolerance: 50.0}
  readout:
    shots: 4
    echo_train_length: 8
