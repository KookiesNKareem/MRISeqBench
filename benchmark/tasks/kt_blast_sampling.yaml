# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: kt_blast_sampling
objective: Acquire eight Cartesian frames with twofold phase-encode undersampling, alternating
  odd/even masks each frame, plus four central training lines in every frame.
sequence:
  level: S4
  capabilities: [spoiled_gre, cartesian, kt_blast, interleaved, dynamic]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  sampling:
    acceleration: 2
    calibration_lines: 4
    pattern: uniform
  temporal:
    frames: 8
    frame_duration_ms: 100
    ordering: interleaved
