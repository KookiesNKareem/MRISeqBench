# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T3.1
id: sense_sampling
version: 2
objective: Create an undersampled Cartesian spoiled GRE acquisition designed for SENSE reconstruction.
  Retain even zero-based ky grid indices and add the eight central indices 60 through 67.
object: P1@1
sequence:
  level: T3
  capabilities: [spoiled_gre, cartesian, undersampling, sense]
  matrix: [128, 128]
  fov_mm: [200, 200]
  duration_s: 6
  sampling:
    acceleration: 2
    calibration_lines: 8
evaluation: s3@5
followups:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm and set the excitation flip angle
    to 10 degrees. Preserve the matrix and all other requirements.
  patch:
    fov_mm:
    - 220
    - 220
    flip_angle_deg: 10
- id: parameter
  request: Set the excitation flip angle to 30 degrees. Retain the larger FOV and
    all other requirements.
  patch:
    flip_angle_deg: 30
- id: sampling
  request: Increase the uniform ky undersampling factor to R=3 with 12 central calibration
    lines, while retaining the 220 x 220 mm FOV and 30-degree flip angle.
  patch:
    sampling.acceleration: 3
    sampling.calibration_lines: 12
