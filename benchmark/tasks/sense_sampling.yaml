# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: sense_sampling
objective: Create an undersampled Cartesian spoiled GRE acquisition designed for SENSE reconstruction.
  Retain even zero-based ky grid indices and add the eight central indices 12 through 19.
object: cardiac_2d@1
sequence:
  level: S3
  capabilities: [spoiled_gre, cartesian, undersampling, sense]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  sampling:
    acceleration: 2
    calibration_lines: 8
evaluation: s3@2
