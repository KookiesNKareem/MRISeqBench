# yaml-language-server: $schema=../../schemas/tasks.schema.json
# T3.8
id: reduced_fov
version: 2
objective: Use an inner-volume excitation/refocusing pair to select the central 100 mm phase FOV.
  Acquire even zero-based ky indices with full 128-point readouts and suppress signal outside the selected
  region at the echo, either by y-selective excitation or by a y-selective refocuser whose unrefocused
  signal is removed by in-plane crusher dephasing within each image voxel.
object: P1@1
sequence:
  level: T3
  capabilities: [spin_echo, cartesian, reduced_fov]
  matrix: [128, 128]
  fov_mm: [200, 200]
  duration_s: 24
  sampling:
    reduced_fov_fraction: 0.5
    pattern: reduced_fov
evaluation: s3@5
followups:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm and set TE to 80 ms (tolerance
    2 ms). Preserve the matrix and all other requirements.
  patch:
    fov_mm:
    - 220
    - 220
    te_ms:
      target: 80
      tolerance: 2
- id: parameter
  request: Set TE to 100 ms (tolerance 2 ms). Retain the larger FOV and all other
    requirements.
  patch:
    te_ms:
      target: 100
      tolerance: 2
- id: sampling
  request: Narrow the inner-volume reduced-FOV fraction along y to 0.25 (retaining
    every 4th ky line), while retaining the 220 x 220 mm FOV and preceding TE change.
  patch:
    sampling.reduced_fov_fraction: 0.25
