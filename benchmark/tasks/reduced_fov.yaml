# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: reduced_fov
objective: Use an inner-volume excitation/refocusing pair to restrict the excited phase-encode
  extent to the central 100 mm of the prescribed 200 mm FOV. Acquire the corresponding phase-encode
  spacing without signal from outside that region.
sequence:
  level: S3
  capabilities: [spoiled_gre, cartesian, reduced_fov]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  sampling:
    reduced_fov_fraction: 0.5
    pattern: reduced_fov
