# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: interleaved_cine
objective: Acquire four Cartesian cine frames, alternating odd and even phase-encode line
  groups across frames, with 250 ms frame duration.
sequence:
  level: S4
  capabilities: [spoiled_gre, cartesian, cine, interleaved]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  temporal:
    frames: 4
    frame_duration_ms: 250
    ordering: interleaved
