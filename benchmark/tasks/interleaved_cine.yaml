# yaml-language-server: $schema=../../schemas/tasks.schema.json
schema_version: 1
id: interleaved_cine
version: 1
objective: Acquire four Cartesian cine frames, alternating odd and even phase-encode
  line groups across frames, with 250 ms frame duration.
sequence:
  level: S4
  capabilities:
  - spoiled_gre
  - cartesian
  - cine
  - interleaved
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 6
  temporal:
    frames: 4
    frame_duration_ms: 250
    ordering: interleaved
object: tissue_discs@1
hardware: standard@1
evaluation: image_fidelity@1
submission:
  format: pulseq
  file: sequence.seq
