# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: t1_mapping
objective: >-
  Acquire three ECG-triggered cardiac inversion-prepared Cartesian bSSFP
  images with TI 100, 400 and 1200 ms measured from the inversion-pulse center to
  each image's central-k-space echo. Acquire all source images at the same cardiac
  phase and retain their preparation metadata; an inversion may occur in a preceding
  heartbeat. Allow at least three RR intervals of recovery between separate inversion
  preparations. Every acquired ADC sample must lie between 600 and 800 ms after its
  ECG R-wave trigger, using nominal RR 1000 ms on physio1; preparations may precede
  that window. Use ordinary Cartesian reconstruction. Complete magnetization preparation
  before the imaging window. Balance net gradient area on all three axes in every
  readout TR; alternate excitation RF phase by 180 degrees between readout TRs and
  keep receiver phases coherent with that RF phase cycle.
  Use symmetric echo timing in every acquired readout TR: TE is measured from the
  excitation RF center to the readout k-space-center echo, and abs(TE - TR/2)
  must be no more than max(0.01 ms, 0.05 times TR).
  Each prepared frame must have exactly one inversion RF event before the bSSFP
  readout train, with a waveform-derived nominal flip of at least 170 degrees.
  Inversion timing is measured between RF center and central-k-space echo; the
  timing tolerance is twice the larger of the RF and block-duration rasters.
object: cardiac_2d@1
evaluation: s4@2
sequence:
  level: S4
  capabilities:
  - bssfp
  - cartesian
  - inversion
  - multi_contrast
  - mapping
  - triggering
  - gating
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 16
  application:
    inversion_times_ms:
    - 100
    - 400
    - 1200
  temporal:
    frames: 3
    frame_duration_ms: 1000
    ordering: sequential
    trigger_source: ecg
    rr_interval_ms: 1000
    trigger_delay_ms: 600
    acquisition_window_ms: 200
