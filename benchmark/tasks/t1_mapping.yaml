# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: t1_mapping
version: 2
objective: Acquire inversion-prepared bSSFP images at TI 100, 400 and 1200 ms, in that order, for
  T1 mapping. Use four 32-line ECG-triggered segments per image, repeat the preparation for each
  segment, and allow three RR intervals between preparations.
object: cardiac_2d@1
evaluation: s4@3
sequence:
  level: S4
  capabilities: [bssfp, cartesian, inversion, multi_contrast, mapping, triggering, gating]
  matrix: [128, 128]
  fov_mm: [200, 200]
  duration_s: 60
  application:
    inversion_times_ms: [100, 400, 1200]
  temporal:
    frames: 3
    trigger_source: ecg
    rr_interval_ms: 1000
    trigger_delay_ms: 600
    acquisition_window_ms: 200
    segments_per_frame: 4
