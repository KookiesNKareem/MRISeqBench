# T3.6
id: elliptical_kspace
version: 2
objective: Acquire a 128 x 128 x 32 Cartesian volume retaining pairs with ((iy-64)/64)^2 + ((iz-16)/16)^2
  <= 1, including the boundary.
sequence:
  level: T3
  capabilities: [spoiled_gre, cartesian, elliptical_kspace]
  matrix: [128, 128, 32]
  fov_mm: [200, 200, 200]
  duration_s: 128
  te_ms: {target: 3, tolerance: 0.3}
  tr_ms: {target: 10, tolerance: 0.5}
  flip_angle_deg: 20
  sampling:
    pattern: elliptical
object: P1@1
evaluation: s3@4
