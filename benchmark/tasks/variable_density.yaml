# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: variable_density
objective: Acquire a variable-density Cartesian mask with nominal acceleration three, sampling
  probability decreasing linearly with distance from k-space center, eight central calibration
  lines and mask seed 42.
sequence:
  level: S3
  capabilities: [spoiled_gre, cartesian, undersampling, variable_density]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  sampling:
    acceleration: 3
    calibration_lines: 8
    mask_seed: 42
    pattern: variable_density
