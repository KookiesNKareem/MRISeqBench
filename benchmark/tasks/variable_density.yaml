# yaml-language-server: $schema=../../schemas/tasks.schema.json
schema_version: 1
id: variable_density
version: 1
objective: Acquire a variable-density Cartesian mask with nominal acceleration three,
  sampling probability decreasing linearly with distance from k-space center, eight
  central calibration lines and mask seed 42.
sequence:
  level: S3
  capabilities:
  - spoiled_gre
  - cartesian
  - undersampling
  - variable_density
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 6
  sampling:
    acceleration: 3
    calibration_lines: 8
    mask_seed: 42
    pattern: variable_density
object: tissue_discs@1
hardware: standard@1
evaluation: image_fidelity@1
submission:
  format: pulseq
  file: sequence.seq
