# yaml-language-server: $schema=../../schemas/tasks.schema.json
schema_version: 1
id: asymmetric_echo
version: 1
objective: 'Acquire each Cartesian readout asymmetrically about its echo center: retain
  the negative-kx quarter and the full nonnegative-kx half of the prescribed grid,
  for 75 percent readout coverage.'
sequence:
  level: S3
  capabilities:
  - spoiled_gre
  - cartesian
  - asymmetric_echo
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 6
  sampling:
    asymmetric_echo_fraction: 0.75
    pattern: asymmetric_echo
object: tissue_discs@1
hardware: standard@1
evaluation: image_fidelity@1
submission:
  format: pulseq
  file: sequence.seq
