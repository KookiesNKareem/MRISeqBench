# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: asymmetric_echo
objective: 'Acquire each Cartesian readout asymmetrically about its echo center: retain the
  negative-kx quarter and the full nonnegative-kx half of the prescribed grid, for 75 percent
  readout coverage.'
sequence:
  level: S3
  capabilities: [spoiled_gre, cartesian, asymmetric_echo]
  matrix: [32, 32]
  fov_mm: [200, 200]
  duration_s: 6
  sampling:
    asymmetric_echo_fraction: 0.75
    pattern: asymmetric_echo
