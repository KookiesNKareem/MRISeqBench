# yaml-language-server: $schema=../../schemas/workflows.schema.json
id: adiabatic_inversion
version: 1
task: adiabatic_inversion@2
qualification: draft
initial_patch: {}
stages:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm. Preserve the matrix and all
    other requirements.
  patch:
    fov_mm:
    - 220
    - 220
- id: parameter
  request: Set application.inversion_time_ms to 650. Move the acquisition window start
    to 650 ms as well to accommodate the new TI. Retain the larger FOV and all other
    requirements.
  patch:
    application.inversion_time_ms: 650
    temporal.trigger_delay_ms: 650
- id: restore_fov
  request: Restore the original 200 x 200 mm in-plane FOV, while retaining the parameter
    changes from the preceding turn.
  patch:
    fov_mm:
    - 200
    - 200
