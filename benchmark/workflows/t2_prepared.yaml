# yaml-language-server: $schema=../../schemas/workflows.schema.json
id: t2_prepared
version: 1
task: t2_prepared@2
qualification: draft
initial_patch: {}
stages:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm. Preserve the matrix and all
    other requirements.
  patch:
    fov_mm:
    - 220
    - 220
- id: parameter
  request: Set application.preparation_duration_ms to 50. Retain the larger FOV and
    all other requirements.
  patch:
    application.preparation_duration_ms: 50
- id: restore_fov
  request: Restore the original 200 x 200 mm in-plane FOV, while retaining the parameter
    changes from the preceding turn.
  patch:
    fov_mm:
    - 200
    - 200
