id: rf_excitation_2d
version: 1
task: rf_excitation_2d@2
qualification: draft
initial_patch:
  excitation_target:
    amplitude: 0.5
    offset_mm:
    - 0
    - 0
stages:
- id: amplitude
  request: Reduce target transverse magnitude to 0.35; keep the target location and
    shape.
  patch:
    excitation_target:
      amplitude: 0.35
      offset_mm:
      - 0
      - 0
- id: translate
  request: Translate the target by +10 mm along x; retain magnitude 0.35.
  patch:
    excitation_target:
      amplitude: 0.35
      offset_mm:
      - 10
      - 0
- id: restore_amplitude
  request: Restore the original target magnitude 0.5; retain the +10 mm x translation.
  patch:
    excitation_target:
      amplitude: 0.5
      offset_mm:
      - 10
      - 0
