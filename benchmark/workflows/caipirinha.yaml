# yaml-language-server: $schema=../../schemas/workflows.schema.json
id: caipirinha
version: 1
task: caipirinha@2
qualification: draft
initial_patch:
  flip_angle_deg: 20
stages:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm. Preserve the matrix and all
    other requirements.
  patch:
    fov_mm:
    - 220
    - 220
    - 200
- id: parameter
  request: Set flip_angle_deg to 30. Retain the larger FOV and all other requirements.
  patch:
    flip_angle_deg: 30
- id: restore_fov
  request: Restore the original 200 x 200 mm in-plane FOV, while retaining the parameter
    changes from the preceding turn.
  patch:
    fov_mm:
    - 200
    - 200
    - 200
