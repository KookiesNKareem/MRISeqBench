# yaml-language-server: $schema=../../schemas/workflows.schema.json
id: epi_single_shot
version: 1
task: epi_single_shot@2
qualification: draft
initial_patch:
  te_ms:
    target: 70
    tolerance: 2
stages:
- id: fov
  request: Increase the in-plane FOV to 220 x 220 mm. Preserve the matrix and all
    other requirements.
  patch:
    fov_mm:
    - 220
    - 220
- id: parameter
  request: 'Set te_ms to {''target'': 90, ''tolerance'': 2}. Retain the larger FOV
    and all other requirements.'
  patch:
    te_ms:
      target: 90
      tolerance: 2
- id: restore_fov
  request: Restore the original 200 x 200 mm in-plane FOV, while retaining the parameter
    changes from the preceding turn.
  patch:
    fov_mm:
    - 200
    - 200
