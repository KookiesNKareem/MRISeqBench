id: reduced_fov
objective: Use an inner-volume excitation/refocusing pair to restrict the excited phase-encode extent to the central 100 mm of the prescribed 200 mm FOV. Acquire the corresponding phase-encode spacing without signal from outside that region. Retain even zero-based ky indices with full readouts; the reconstructed central half of the phase FOV preserves the prescribed spatial resolution. Use TE 80 ms and TR 1000 ms.
object: cardiac_2d@1
sequence:
  level: S3
  capabilities:
  - spin_echo
  - cartesian
  - reduced_fov
  matrix:
  - 256
  - 256
  fov_mm:
  - 200
  - 200
  duration_s: 135
  sampling:
    reduced_fov_fraction: 0.5
    pattern: reduced_fov
  tr_ms:
    target: 1000
    tolerance: 50
  te_ms:
    target: 80
    tolerance: 8
evaluation: s3@3
schema_version: 1
version: 2
hardware: high_performance@1
