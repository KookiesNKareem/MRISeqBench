id: sense_sampling
objective: Create an undersampled Cartesian spoiled GRE acquisition designed for SENSE reconstruction. Retain even zero-based ky grid indices and add the 32 central indices 112 through 143. Use full 256-sample readouts, TE 3 ms and TR 12 ms.
object: cardiac_2d@1
sequence:
  level: S3
  capabilities:
  - spoiled_gre
  - cartesian
  - undersampling
  - sense
  matrix:
  - 256
  - 256
  fov_mm:
  - 200
  - 200
  duration_s: 6
  sampling:
    acceleration: 2
    calibration_lines: 32
  tr_ms:
    target: 12
    tolerance: 0.6
  te_ms:
    target: 3
    tolerance: 0.3
evaluation: s3@3
schema_version: 1
version: 2
hardware: high_performance@1
