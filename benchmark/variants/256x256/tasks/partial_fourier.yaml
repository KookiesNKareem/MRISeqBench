id: partial_fourier
objective: Create a Cartesian spoiled GRE acquisition using partial Fourier sampling. Retain the contiguous upper 192 zero-based ky grid indices, 64 through 255, including the center. Use full 256-sample readouts, TE 3 ms and TR 12 ms.
object: cardiac_2d@1
sequence:
  level: S3
  capabilities:
  - spoiled_gre
  - cartesian
  - partial_fourier
  matrix:
  - 256
  - 256
  fov_mm:
  - 200
  - 200
  duration_s: 6
  sampling:
    partial_fourier_fraction: 0.75
  tr_ms:
    target: 12
    tolerance: 0.6
  te_ms:
    target: 3
    tolerance: 0.3
evaluation: s3@3
schema_version: 1
version: 2
hardware: high_performance@1
