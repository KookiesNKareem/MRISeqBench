id: grase
objective: Acquire a Cartesian GRASE image in 32 shots. Each shot has four spin echoes with two alternating-polarity gradient echoes around each spin echo, producing eight lines per shot.
object: cardiac_2d@1
sequence:
  level: S2
  capabilities:
  - spin_echo
  - grase
  - epi
  matrix:
  - 256
  - 256
  fov_mm:
  - 200
  - 200
  duration_s: 36
  te_ms:
    target: 40
    tolerance: 4.0
  tr_ms:
    target: 1000
    tolerance: 50.0
  readout:
    shots: 32
    echo_train_length: 8
evaluation: s2@4
schema_version: 1
version: 2
hardware: high_performance@1
