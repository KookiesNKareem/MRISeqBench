# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: epi_single_shot_research
objective: Make a single-shot echo-planar imaging sequence. Research the sequence
  and choose an appropriate implementation.
object: cardiac_2d@1
sequence:
  level: S2
  capabilities:
  - epi
  - cartesian
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 1
prompt_mode: research
identity_requirements:
- One excitation acquires the complete image echo train using alternating readout
  polarity and phase-encoding blips.
evaluation: s2@3
