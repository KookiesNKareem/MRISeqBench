# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: variable_density_research
objective: Make an imaging sequence with variable-density sampling. Research the sequence
  and choose an appropriate implementation.
object: cardiac_2d@1
sequence:
  level: S3
  capabilities:
  - spoiled_gre
  - cartesian
  - undersampling
  - variable_density
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 6
prompt_mode: research
identity_requirements:
- The sampling density is greater near the k-space center than in the periphery.
evaluation: s3@2
