# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: asymmetric_echo_research
objective: Make an asymmetric-echo imaging sequence. Research the sequence and choose
  an appropriate implementation.
object: cardiac_2d@1
sequence:
  level: S3
  capabilities:
  - spoiled_gre
  - cartesian
  - asymmetric_echo
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 6
prompt_mode: research
identity_requirements:
- The readout samples an asymmetric interval about the gradient echo and includes
  the k-space origin.
evaluation: s3@2
