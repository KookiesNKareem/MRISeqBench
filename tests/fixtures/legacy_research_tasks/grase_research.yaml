# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: grase_research
objective: Make a GRASE imaging sequence. Research the sequence and choose an appropriate
  implementation.
object: cardiac_2d@1
sequence:
  level: S2
  capabilities:
  - spin_echo
  - grase
  - epi
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 8
prompt_mode: research
identity_requirements:
- Spin-echo refocusing and gradient-echo trains are combined in the acquisition.
evaluation: s2@3
