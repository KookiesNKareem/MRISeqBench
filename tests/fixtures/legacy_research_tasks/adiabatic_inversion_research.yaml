# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: adiabatic_inversion_research
objective: Make an ECG-triggered cardiac adiabatic inversion acquisition. Research
  the sequence and choose an expert-quality implementation and cardiac timing.
object: cardiac_2d@1
sequence:
  level: S4
  capabilities:
  - spoiled_gre
  - cartesian
  - adiabatic
  - inversion
  - triggering
  - gating
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 6
prompt_mode: research
identity_requirements:
- An adiabatic inversion pulse precedes imaging, with a defined inversion delay and
  an RF sweep that supports adiabatic inversion within hardware limits.
- ECG R-wave triggers establish a consistent cardiac acquisition phase. Emit Pulseq
  trigger events on physio1 and record the chosen RR interval, trigger delay, acquisition
  window and preparation timings in Pulseq definitions. All imaging ADCs remain within
  the declared cardiac window; choose expert-quality timing for the specified phantom
  and hardware.
