# yaml-language-server: $schema=../../schemas/tasks.schema.json
id: spin_echo_t2w_research
objective: Make a T2-weighted spin-echo imaging sequence. Research the sequence and
  choose an appropriate implementation.
object: cardiac_2d@1
sequence:
  level: S1
  capabilities:
  - spin_echo
  - cartesian
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 40
prompt_mode: research
identity_requirements:
- Excitation and refocusing pulses form spin echoes, with TE and TR consistent with
  T2 weighting for the supplied tissues.
evaluation: s1@3
