id: ute_radial_research
objective: Make an ultrashort-echo-time radial imaging sequence. Research the sequence
  and choose an appropriate implementation.
object: cardiac_2d@1
sequence:
  level: S2
  capabilities:
  - spoiled_gre
  - ute
  - radial
  matrix:
  - 32
  - 32
  fov_mm:
  - 200
  - 200
  duration_s: 6
prompt_mode: research
identity_requirements:
- Center-out radial acquisition places ADC as close to excitation as hardware dead
  times permit, consistent with ultrashort TE.
evaluation: s2@3
