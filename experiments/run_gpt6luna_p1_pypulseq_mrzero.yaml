# yaml-language-server: $schema=../schemas/experiments.schema.json
# Matches the completed gpt6luna-p2 campaign; use the recorded P2-compatible
# source snapshot and environment in campaign-support/luna-p1-20261024 on Ultron.
schema_version: 1
id: run_gpt6luna_p1_pypulseq_mrzero
version: 1
suite: full@1
arm: p1_pypulseq_mrzero@1
arm_runtime:
  author_image: sha256:f85d45df5d77a65ee61b477a2c247b970f46b1ccdc4c580994f8bd6343f45f93
  simulator_image: sha256:58fed752aa1c5a8d4fe5f26d1c7e7e01574f5500b0214def71dff0cef694bd8c
  probe_timeout_s: 600
  simulation_timeout_s: 300
  author_memory_mb: 2048
repeats: 3
submission_mode: submit
max_submissions: 3
agent:
  uses_model: true
  adapter: pi
  pi_version: 0.87.0
  auto_compaction: false
  model: openai/gpt-6-luna
  command:
  - pi
  - --provider
  - openrouter
  - --model
  - '{model}'
  - --thinking
  - '{thinking_level}'
  - --session-dir
  - '{workspace}/transcript'
  - --mode
  - json
  - -p
  - '{prompt_text}'
  timeout_s: 1200
  sandbox:
    backend: docker
api_proxy:
  provider_endpoint: openai
  allowed_routes:
  - /responses
  temperature: null
  top_p: null
  reasoning_effort: high
  max_output_tokens: null
  upstream_url: https://openrouter.ai/api/v1
  key_env: OPENROUTER_API_KEY
feedback:
  timeout_s: 300
seed: 42
concurrency:
  agents: 24
  graders: 4
  simulators: 4
